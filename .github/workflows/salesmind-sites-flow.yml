name: SalesMind Sites - motore CRM automatico
on:
  schedule:
    - cron: '7 * * * *'        # ogni ora: collega il numero 055 appena Telnyx approva
    - cron: '30 7 * * 1-5'     # lun-ven 09:30 italiane: motore chiamate dal CRM
    - cron: '30 11 * * 1-5'    # lun-ven 13:30 italiane: report giornaliero via email
  workflow_dispatch:
    inputs:
      run_engine:
        description: 'Esegui il motore chiamate ora (true/false)'
        default: 'false'

jobs:
  wire-numero:
    runs-on: ubuntu-latest
    if: github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Collega numero 055 se attivo
        run: |
          curl -s -X POST -H "x-hub-code: ${{ secrets.HUB_CODE }}" \
            "https://salesmindsites.vercel.app/api/hub?op=wire055"

  motore-chiamate:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 7 * * 1-5' || inputs.run_engine == 'true'
    steps:
      - name: Coda dal CRM ed esecuzione chiamate
        run: |
          H="x-hub-code: ${{ secrets.HUB_CODE }}"
          BASE="https://salesmindsites.vercel.app/api/hub"
          QUEUE=$(curl -s -H "$H" "$BASE?op=queue&new=40&fu=15")
          TOT=$(echo "$QUEUE" | jq '.totale')
          echo "In coda oggi: $TOT (follow-up: $(echo "$QUEUE" | jq '.followups|length'), nuovi: $(echo "$QUEUE" | jq '.nuovi|length'))"
          echo "$QUEUE" | jq -c '.followups[], .nuovi[]' | while read -r item; do
            ID=$(echo "$item" | jq -r '.id')
            TO=$(echo "$item" | jq -r '.to')
            VARS=$(echo "$item" | jq -c '.vars')
            ATT=$(echo "$item" | jq -r '.vars.call_attempt')
            echo "--- chiamo $ID ($TO, tentativo $ATT)"
            RES=$(curl -s -X POST -H "$H" -H 'content-type: application/json' \
              -d "{\"to\":\"$TO\",\"vars\":$VARS}" "$BASE?op=call")
            echo "$RES" | jq -c '{success, conversation_id, message}'
            if [ "$(echo "$RES" | jq -r '.success')" = "true" ]; then
              curl -s -X POST -H "$H" -H 'content-type: application/json' \
                -d "{\"id\":\"$ID\",\"patch\":{\"stato\":\"Contattato\",\"canale\":\"AI Voice\",\"followup\":\"\"}}" \
                "$BASE?op=crmset" > /dev/null
            fi
            sleep 75
          done
          echo "Motore completato."

  report-giornaliero:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 11 * * 1-5'
    steps:
      - name: Report via email ad admintelesales
        run: |
          curl -s -X POST -H "x-hub-code: ${{ secrets.HUB_CODE }}" \
            "https://salesmindsites.vercel.app/api/hub?op=report"
