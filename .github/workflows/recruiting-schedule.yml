name: Recruiting Auto Schedule

# Ogni mattina feriale seleziona candidati veri e programma il batch del giorno su ElevenLabs.
# Gira nel cloud di GitHub, indipendente dal Mac. Le chiamate poi partono da ElevenLabs.
on:
  schedule:
    - cron: "0 6 * * 1-5"    # 08:00 Europe/Rome (estate), feriali
  workflow_dispatch:
    inputs:
      size:
        description: "Quanti candidati chiamare"
        required: false
        default: "20"
      slot_hour:
        description: "Ora di partenza (0-23, Europe/Rome)"
        required: false
        default: "11"
      same_day:
        description: "Schedulare oggi stesso? (1 = si)"
        required: false
        default: "0"

concurrency:
  group: recruiting-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests tzdata
      - name: Programma batch recruiting del giorno
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUN_SIZE: ${{ github.event.inputs.size }}
          RUN_SLOT_HOUR: ${{ github.event.inputs.slot_hour }}
          RUN_SAME_DAY: ${{ github.event.inputs.same_day }}
        run: python3 recruiting_kv_schedule.py
